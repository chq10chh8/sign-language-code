# @package _group_

common:
  fp16: true
  log_format: json
  wandb_project: shubert-pretrain-full
  log_interval: 20
  tensorboard_logdir: tb

checkpoint:
  save_interval: 10
  no_epoch_checkpoints: false
  keep_last_epochs: -1
  save_interval_updates: 50000
  keep_interval_updates: 10
  load_checkpoint_on_all_dp_ranks: true
  reset_optimizer: true  

task:
  _name: audio_pretraining
  data: /scratch/project_465003161/YouTube_ASL/features/h5_full
  kmeans_label_paths:
    face: /scratch/project_465003161/YouTube_ASL/km_labels/iter2/split/face_train.km
    left_hand: /scratch/project_465003161/YouTube_ASL/km_labels/iter2/split/lhand_train.km
    right_hand: /scratch/project_465003161/YouTube_ASL/km_labels/iter2/split/rhand_train.km
    body_posture: /scratch/project_465003161/YouTube_ASL/km_labels/iter2/split/body_train.km
  max_sample_size: 5000
  min_sample_size: 1
  normalize: true
  sample_rate: 1

dataset:
  num_workers: 8
  valid_subset: valid
  max_tokens: 8000
  skip_invalid_size_inputs_valid_test: true
  validate_interval: 5
  validate_interval_updates: 2500000
  required_batch_size_multiple: 1
  disable_validation: false

distributed_training:
  distributed_world_size: 8
  ddp_backend: legacy_ddp

criterion:
  _name: model

optimization:
  max_update: 200000
  lr: [0.0005]

optimizer:
  _name: adam
  adam_betas: (0.9,0.98)
  adam_eps: 1e-06
  weight_decay: 0.01

lr_scheduler:
  _name: polynomial_decay
  warmup_updates: 16000

model:
  _name: shubert
  extractor_mode: layer_norm
  encoder_layerdrop: 0.05
  dropout_input: 0.0
  dropout_features: 0.0
  feature_grad_mult: 1.0
  encoder_embed_dim: 768
  codebook_size: 256
  mask_prob: 0.8
  mask_length: 3
  require_same_masks: true
  mask_dropout: 0
  channels_embed_dim: 50
  channels_hand_embed_dim: 42
  channels_pose_embed_dim: 14
  intermediate_dim: 1024
  mask_strategy: random
